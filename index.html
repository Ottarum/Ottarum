<script>
        // 1. Inicializamos el contexto una sola vez, fuera de las funciones
        let audioCtx;

        const initAudio = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Esto "despierta" el contexto bloqueado por el navegador
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playTone = (freq, type, duration) => {
            // Aseguramos que el contexto esté activo
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        };

        // 2. Escucha de interacciones
        document.querySelectorAll('.interactive, .btn-download, .social-links a').forEach(el => {
            el.addEventListener('mouseenter', () => playTone(440, 'sine', 0.1));
            el.addEventListener('click', () => playTone(880, 'square', 0.2));
        });

        // 3. Desbloqueo forzado al primer clic en cualquier parte
        window.addEventListener('click', initAudio, { once: true });
    </script>
