<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           FONDO LÍQUIDO OPTIMIZADO (WEBP) CON EFECTO PARALLAX
           ========================================================================== */
        .liquid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 140vh;
            pointer-events: none;
            z-index: -3;
            background-image: url('figuenoise.webp'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            animation: parallaxScroll linear both;
            animation-timeline: scroll(root);
            animation-range: start end;
        }

        @keyframes parallaxScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-20vh); }
        }

        /* CAPA DE GRANO CINEMATOGRÁFICO DE ALTA FIDELIDAD */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.11;
            background-image: url('grano_pelicula_ottarum.png.png'); 
            background-size: 240px 240px;
            mix-blend-mode: overlay; 
        }

        /* Atmósfera de Luces de Fondo (Glow perimetral) */
        .glow-orange {
            position: fixed; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(255, 95, 0, 0.12) 0%, transparent 70%);
            top: -200px; left: -100px; z-index: -2; pointer-events: none; filter: blur(100px);
        }
        .glow-cyan {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
            bottom: -100px; right: -100px; z-index: -2; pointer-events: none; filter: blur(100px);
        }

        /* SOMBREADO NEGRO INFERIOR PARA INTEGRACIÓN DEL CONTENIDO */
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: linear-gradient(to bottom, rgba(3, 7, 8, 0) 0%, var(--bg-dark) 100%);
            pointer-events: none;
            z-index: -2;
        }

        /* FRANJA VERTICAL CENTRAL CRISTALIZADA */
        .central-strip {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1300px;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.02);
            border-right: 1px
