<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           FONDO LÍQUIDO CON EFECTO PARALLAX (DESFASE DE VELOCIDAD SUAVE)
           ========================================================================== */
        .liquid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 140vh; /* Es más alto que la pantalla para tener margen de movimiento */
            pointer-events: none;
            z-index: -3;
            
            /* Cargamos tu nueva imagen vertical alargada */
            background-image: url('figuenoise.jpg'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            
            /* Animación vinculada al movimiento del Scroll */
            animation: parallaxScroll linear both;
            animation-timeline: scroll(root);
            animation-range: start end;
        }

        /* Define cuánto se va a desplazar el fondo (un desfase lento y elegante) */
        @keyframes parallaxScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-25vh); } /* Se mueve mucho más lento que el scroll real */
        }

        /* CAPA DE GRANO CINEMATOGRÁFICO REAL */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04; 
            background-image: url('https://raw.githubusercontent.com/AnisMontacer/Film-Grain-Overlay/master/Film-Grain-Overlay.jpg'); 
            background-size: cover;
            mix-blend-mode: overlay; 
        }

        /* Atmósfera de Luces Trippy de Fondo */
        .glow-orange {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 95, 0, 0.12) 0%, transparent 70%);
            top: -200px; left: -100px; z-index: -2; pointer-events: none; filter: blur(80px);
        }
        .glow-cyan {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
            bottom: -100px; right: -100px; z-index: -2; pointer-events: none; filter: blur(80px);
        }

        /* SOMBREADO NEGRO FIJO EN LA ZONA INFERIOR DE LA PANTALLA */
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh; /* Controla qué tan arriba empieza a oscurecerse */
            background: linear-gradient(to bottom, rgba(3, 7, 8, 0) 0%, var(--bg-dark) 100%);
            pointer-events: none;
            z-index: -2; /* Por encima del fluido, por detrás del contenido */
        }

        /* FRANJA VERTICAL CENTRAL ÚNICA Y CONTINUA */
        .central-strip {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1300px;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            
            border-left: 1px solid rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            
            background: linear-gradient(
                to right, 
                rgba(3, 7, 8, 0.88) 0%, 
                rgba(3, 7, 8, 0.40) 25%, 
                rgba(3, 7, 8, 0.40) 75%, 
                rgba(3, 7, 8, 0.88) 100%
            );
            
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
        }

        /* Contenedores */
        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 0 50px; 
            width: 100%; 
            position: relative;
            z-index: 2;
        }

        section { 
            padding: 140px 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            position: relative; 
            width: 100%;
        }

        /* HERO SECTION */
        #hero { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 0; 
        }
        
        .hero-title { 
            font-family: 'Syne', sans-serif; 
            font-size: clamp(3.5rem, 7.5vw, 7.5rem); 
            font-weight: 800; 
            line-height: 0.9; 
            text-transform: uppercase; 
            letter-spacing: -3px; 
            background: linear-gradient(180deg, #fff 40%, var(--text-muted)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 4px 30px rgba(0,0,0,0.5); 
            width: 100%;
            word-break: break-word;
        }
        
        .hero-subtitle { font-size: 1.4rem; margin-top: 20px; color: var(--accent-orange); letter-spacing: 4px; text-transform: uppercase; font-weight: 700; }

        /* ARSENAL / SOFTWARE (CRISTAL MINIMALISTA Y PULIDO) */
        h2.section-heading { font-family: 'Syne', sans-serif; font-size: 3rem; margin-bottom: 60px; text-transform: uppercase; border-left: 5px solid var(--accent-orange); padding-left: 20px; width: 100%; }
        
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; width: 100%; }
        
        .software-card { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0%, rgba(255, 255, 255, 0.005) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 40px 20px; 
            border-radius: 14px; 
            text-align: center; 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        
        .software-card:hover { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border-color: rgba(255, 255, 255, 0.15); 
            transform: translateY(-5px); 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        
        /* Primer cajón (Blender) destacado sutilmente en cian minimalista */
        .software-card:first-child {
            border-color: rgba(0, 245, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 245, 255, 0.03);
        }
        .software-card:first-child:hover {
            border-color: rgba(0, 245, 255, 0.5);
        }

        .software-card i { font-size: 3.5rem; color: #fff; margin-bottom: 15px; display: block; transition: transform 0.5s ease; }
        .software-card:hover i { transform: scale(1.05); }
        .software-card h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
        .software-card p { color: var(--text-muted); font-size: 0.9rem; }

        /* GALERÍA INTERACTIVA */
        .project-row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 60px; margin-bottom: 120px; align-items: center; width: 100%; }
        
        .media-box { background: #0b1112; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); aspect-ratio: 16/9; }
        .media-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .tech-data { padding: 30px; font-family: monospace; font-size: 0.95rem; color: var(--accent-cyan); background: rgba(0,0,0,0.4); border-radius: 12px; border-left: 3px solid var(--accent-cyan); }
        .tech-data h3 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 15px; text-transform: uppercase; font-weight: 700; }
        .tech-data p { color: #fff; margin-bottom: 15px; font-family: 'Space Grotesk', sans-serif; }
        .tech-data ul { list-style: none; }
        .tech-data li { margin-bottom: 8px; color: var(--text-muted); }
        .tech-data li strong { color: #fff; }

        /* WALLPAPERS / DOWNLOADS */
        .wallpaper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; width: 100%; }
        .wallpaper-card { border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); aspect-ratio: 9/16; }
        .wallpaper-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .wallpaper-card:hover img { transform: scale(1.05); }
        
        .download-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; justify-content: space-between; align-items: center; }
        .btn-download { background: var(--accent-orange); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 0.3s; font-size: 0.9rem; text-transform: uppercase;}
        .btn-download:hover { background: #fff; color: var(--bg-dark); }

        /* SOCIAL FOOTER */
        footer { padding: 80px 0; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; width: 100%; position: relative; z-index: 10; }
        .social-links { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .social-links a { color: #fff; font-size: 2rem; transition: color 0.3s; text-decoration: none; }
        .social-links a:hover { color: var(--accent-orange); }
        footer p { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
