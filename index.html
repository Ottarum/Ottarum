<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           FONDO LÍQUIDO CON MÁSCARA GRADUAL (Hero Background)
           ========================================================================== */
        .liquid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: -2; /* Se queda completamente detrás de las luces y textos */
            
            /* Cargamos tu imagen de fluido tosco */
            background-image: url('noise.png'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            
            /* Máscara que desvanece el fluido de forma orgánica antes de entrar al Arsenal */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        /* CAPA DE GRANO CINEMATOGRÁFICO REAL (SUPER SUTIL - AL FRENTE) */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04; 
            background-image: url('https://raw.githubusercontent.com/AnisMontacer/Film-Grain-Overlay/master/Film-Grain-Overlay.jpg'); 
            background-size: cover;
            mix-blend-mode: overlay; 
        }

        /* Atmósfera de Luces Trippy de Fondo */
        .glow-orange {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 95, 0, 0.12) 0%, transparent 70%);
            top: -200px; left: -100px; z-index: -1; pointer-events: none; filter: blur(80px);
        }
        .glow-cyan {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
            bottom: -100px; right: -100px; z-index: -1; pointer-events: none; filter: blur(80px);
        }

        /* Contenedores */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 40px; width: 100%; }
        section { padding: 120px 0; min-height: 100vh; display: flex; align-items: center; position: relative; }

        /* HERO SECTION */
        #hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0; }
        .hero-title { font-family: 'Syne', sans-serif; font-size: 8vw; font-weight: 800; line-height: 0.9; text-transform: uppercase; letter-spacing: -3px; background: linear-gradient(180deg, #fff 40%, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        .hero-subtitle { font-size: 1.4rem; margin-top: 20px; color: var(--accent-orange); letter-spacing: 4px; text-transform: uppercase; font-weight: 700; }

        /* ARSENAL / SOFTWARE */
        h2.section-heading { font-family: 'Syne', sans-serif; font-size: 3rem; margin-bottom: 60px; text-transform: uppercase; border-left: 5px solid var(--accent-orange); padding-left: 20px; width: 100%; }
        
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; width: 100%; }
        .software-card { background: rgba(3, 7, 8, 0.6); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.05); padding: 40px 20px; border-radius: 16px; text-align: center; transition: all 0.4s ease; }
        .software-card:hover { border-color: var(--accent-cyan); transform
