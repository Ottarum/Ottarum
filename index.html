<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Variables globales */
        :root {
            --bg-dark: #030708;
            --text-light: #ffffff;
            --accent-orange: #ff4500;
        }

        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           FONDO LÍQUIDO CON MÁSCARA GRADUAL (Sin cortes ni saltos)
           ========================================================================== */
        .noise-overlay {
            position: fixed; /* Se queda estático de fondo cubriendo la pantalla */
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            
            /* Cargamos tu imagen original */
            background-image: url('noise.png'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat; /* Evitamos que se duplique para eliminar la línea de corte */
            
            /* EL TRUCO MAESTRO: Una máscara que desvanece la imagen hacia negro al final del Hero */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }

        /* ==========================================================================
           SECCIONES GENERALES (Estructura y Espaciado)
           ========================================================================== */
        
        #hero {
            width: 100%;
            height: 100vh; /* Ocupa exactamente el primer pantallazo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-bottom: 20px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); 
        }

        .hero-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-orange);
            margin-bottom: 30px;
            font-weight: 700;
        }

        .hero-description {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            max-width: 600px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Sección del Arsenal (Le damos mucha altura para activar el scroll real) */
        .section-arsenal {
            width: 100%;
            min-height: 120vh; /* Forzamos altura para que puedas seguir bajando infinitamente */
            padding: 120px 10%;
            background-color: var(--bg-dark); /* Fondo negro puro donde flotará tu contenido */
            position: relative;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 4.5rem);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: -1px;
            border-left: 6px solid var(--accent-orange);
            padding-left: 20px;
            margin-bottom: 50px;
        }

        .content-placeholder {
            margin-top: 40px;
            color: #475569;
            font-size: 1.2rem;
            border: 2px dashed #1e293b;
            padding: 60px;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <section id="hero">
        <h1 class="hero-title">Ottarum</h1>
        <p class="hero-subtitle">3D Artist & Digital Alchemist</p>
        <p class="hero-description">
            +5 años de experiencia esculpiendo realidades e interrupciones visuales de alta fidelidad.
        </p>
    </section>

    <section class="section-arsenal">
        <h2 class="section-title">El Arsenal Técnico</h2>
        <div class="content-placeholder">
            [ Aquí puedes empezar a pegar tus tarjetas de proyectos, código o rejillas de diseño ]
        </div>
    </section>

</body>
</html>
