<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           FONDO LÍQUIDO OPTIMIZADO (WEBP) CON EFECTO PARALLAX
           ========================================================================== */
        .liquid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 140vh;
            pointer-events: none;
            z-index: -3;
            /* Actualizado a tu nuevo archivo .webp optimizado de 568 KB */
            background-image: url('figuenoise.webp'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            animation: parallaxScroll linear both;
            animation-timeline: scroll(root);
            animation-range: start end;
        }

        @keyframes parallaxScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-20vh); }
        }

        /* CAPA DE GRANO CINEMATOGRÁFICO DE ALTA FIDELIDAD */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.11; /* Ajustado para un grano fino, sutil y estético */
            background-image: url('grano_pelicula_ottarum.png.png'); 
            background-size: 240px 240px; /* Textura repetida en mosaico pequeño para nitidez 4K */
            mix-blend-mode: overlay; 
        }

        /* Atmósfera de Luces de Fondo (Glow perimetral) */
        .glow-orange {
            position: fixed; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(255, 95, 0, 0.12) 0%, transparent 70%);
            top: -200px; left: -100px; z-index: -2; pointer-events: none; filter: blur(100px);
        }
        .glow-cyan {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
            bottom: -100px; right: -100px; z-index: -2; pointer-events: none; filter: blur(100px);
        }

        /* SOMBREADO NEGRO INFERIOR PARA INTEGRACIÓN DEL CONTENIDO */
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: linear-gradient(to bottom, rgba(3, 7, 8, 0) 0%, var(--bg-dark) 100%);
            pointer-events: none;
            z-index: -2;
        }

        /* FRANJA VERTICAL CENTRAL CRISTALIZADA */
        .central-strip {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1300px;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            
            /* Degradado corregido para evitar saltos de color o errores de lectura en navegadores */
            background: linear-gradient(
                to right, 
                rgba(3, 7, 8, 0.5) 0%, 
                rgba(3, 7, 8, 0.05) 20%, 
                rgba(3, 7, 8, 0.05) 80%, 
                rgba(3, 7, 8, 0.5) 100%
            );
            
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.4);
        }

        /* Contenedores */
        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 0 60px; 
            width: 100%; 
            position: relative;
            z-index: 2;
        }

        section { 
            padding: 120px 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            position: relative; 
            width: 100%;
        }

        /* HERO SECTION */
        #hero { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 0; 
        }
        
        .hero-title { 
            font-family: 'Syne', sans-serif; 
            font-size: clamp(3.5rem, 8vw, 7.8rem); 
            font-weight: 800; 
            line-height: 0.85; 
            text-transform: uppercase; 
            letter-spacing: -3px; 
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.6) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            width: 100%;
            word-break: break-word;
        }
        
        .hero-subtitle { font-size: 1.2rem; margin-top: 25px; color: var(--accent-orange); letter-spacing: 5px; text-transform: uppercase; font-weight: 700; }

        /* ==========================================================================
           ARSENAL / SOFTWARE (ESTILO GLASSMORPHISM AVANZADO - APPLE STYLE)
           ========================================================================== */
        h2.section-heading { font-family: 'Syne', sans-serif; font-size: 2.8rem; margin-bottom: 60px; text-transform: uppercase; border-left: 4px solid var(--accent-orange); padding-left: 20px; width: 100%; }
        
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; width: 100%; }
        
        .software-card { 
            /* Fondo de cristal oscuro súper fluido y realista */
            background: rgba(10, 15, 18, 0.25);
            
            /* Difuminado pesado y saturación para distorsionar el fondo orgánico al estilo iOS/macOS */
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            
            /* Modificado: Borde perimetral con leve grosor físico y acabado translúcido en estado inicial */
            border: 1.5px solid rgba(255, 255, 255, 0.09);
            
            /* El truco premium: Bisel de luz interno (inset) superior para dar volumen tridimensional física de vidrio */
            box-shadow: 
                inset 0px 1.5px 0px 0px rgba(255, 255, 255, 0.18),
                0 12px 30px -5px rgba(0, 0, 0, 0.5),
                0 4px 10px -2px rgba(0, 0, 0, 0.3);
            
            padding: 50px 25px; 
            border-radius: 20px; 
            text-align: center; 
            position: relative;
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.5s ease, 
                        box-shadow 0.5s ease,
                        background 0.5s ease;
        }
        
        /* Modificado: Comportamiento interactivo unificado para todos los cajones */
        .software-card:hover { 
            transform: translateY(-6px);
            background: rgba(0, 245, 255, 0.02);
            border-color: rgba(0, 245, 255, 0.6); 
            box-shadow: 
                inset 0px 1.5px 0px 0px rgba(255, 255, 255, 0.35),
                0 22px 40px -10px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(0, 245, 255, 0.15);
        }

        .software-card i { font-size: 3.2rem; color: #fff; margin-bottom: 20px; display: block; transition: transform 0.4s ease; }
        .software-card:hover i { transform: scale(1.05) translateY(-2px); }
        .software-card h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .software-card p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.4; }

        /* GALERÍA / TRABAJOS */
        .project-row { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; margin-bottom: 100px; align-items: center; width: 100
