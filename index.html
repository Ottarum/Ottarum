<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTTARUM | 3D ARTIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Space Grotesk', sans-serif; 
            overflow-x: hidden; 
            position: relative;
        }

        /* FONDO LÍQUIDO */
        .liquid-bg-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            pointer-events: none; z-index: -2; 
            background-image: url('noise.png'); 
            background-size: cover; background-position: center top; 
            background-repeat: no-repeat;
        }

        /* GRANO CINEMATOGRÁFICO */
        .noise-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 9999; opacity: 0.04;
            background-image: url('https://raw.githubusercontent.com/AnisMontacer/Film-Grain-Overlay/master/Film-Grain-Overlay.jpg');
            background-size: cover; mix-blend-mode: overlay;
        }

        /* FRANJA CENTRAL (LA QUE PEDISTE) */
        .central-strip {
            position: fixed; top: 0; left: 15%; width: 70%; height: 100%;
            background: rgba(3, 7, 8, 0.75);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: -1;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 40px; }
        
        #hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-title { 
            font-family: 'Syne', sans-serif; 
            font-size: clamp(3.5rem, 7.5vw, 7.5rem); 
            font-weight: 800; text-transform: uppercase;
            background: linear-gradient(180deg, #fff 40%, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Agrega aquí el resto de tus estilos (.software-card, .project-row, etc.) */
    </style>
</head>
<body>

    <div class="liquid-bg-overlay"></div>
    <div class="noise-overlay"></div>
    <div class="central-strip"></div>

    <main class="container">
        <section id="hero">
            <h1 class="hero-title">OTTARUM</h1>
        </section>
        
        </main>

</body>
</html>
