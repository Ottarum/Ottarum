<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottarum // 3D Digital Artist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030708;
            --accent-orange: #ff5f00;
            --accent-cyan: #00f5ff;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================================================
           CAPA 1: FONDO LÍQUIDO CON EFECTO PARALLAX (BASE)
           ========================================================================== */
        .liquid-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 140vh;
            pointer-events: none;
            z-index: -4; /* Al fondo del todo */
            background-image: url('figuenoise.jpg'); 
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            animation: parallaxScroll linear both;
            animation-timeline: scroll(root);
            animation-range: start end;
        }

        @keyframes parallaxScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-25vh); }
        }

        /* CAPA DE GRANO CINEMATOGRÁFICO */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04; 
            background-image: url('https://raw.githubusercontent.com/AnisMontacer/Film-Grain-Overlay/master/Film-Grain-Overlay.jpg'); 
            background-size: cover;
            mix-blend-mode: overlay; 
        }

        /* Atmósfera de Luces de Fondo */
        .glow-orange {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 95, 0, 0.12) 0%, transparent 70%);
            top: -200px; left: -100px; z-index: -3; pointer-events: none; filter: blur(80px);
        }
        .glow-cyan {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.08) 0%, transparent 70%);
            bottom: -100px; right: -100px; z-index: -3; pointer-events: none; filter: blur(80px);
        }

        /* ==========================================================================
           CAPA 2: FRANJA VERTICAL CENTRAL OSCURA (TÚNEL DE PROFUNDIDAD)
           ========================================================================== */
        .central-strip {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1300px;
            height: 100vh;
            z-index: -2; /* Por encima del fondo líquido, por debajo del contenido */
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            
            /* Degradado lateral oscuro que respeta el centro para no tapar el fluido */
            background: linear-gradient(
                to right, 
                rgba(3, 7, 8, 0.75) 0%, 
                rgba(3, 7, 8, 0.25) 25%, 
                rgba(3, 7, 8, 0.25) 75%, 
                rgba(3, 7, 8, 0.75) 100%
            );
            
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
        }

        /* ==========================================================================
           CAPA 4: ZONA INFERIOR NEGRA GRADUAL (SOBRE EL FONDO)
           ========================================================================== */
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: linear-gradient(to bottom, rgba(3, 7, 8, 0) 0%, var(--bg-dark) 95%);
            pointer-events: none;
            z-index: -1; /* Cubre los fondos y la franja para desvanecer a negro antes del contenido */
        }

        /* Contenedores generales de contenido */
        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 0 50px; 
            width: 100%; 
            position: relative;
            z-index: 2; /* Contenido siempre arriba de los efectos de fondo */
        }

        section { 
            padding: 140px 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            position: relative; 
            width: 100%;
        }

        /* HERO SECTION */
        #hero { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 0; 
        }
        
        .hero-title { 
            font-family: 'Syne', sans-serif; 
            font-size: clamp(3.5rem, 7.5vw, 7.5rem); 
            font-weight: 800; 
            line-height: 0.9; 
            text-transform: uppercase; 
            letter-spacing: -3px; 
            background: linear-gradient(180deg, #fff 40%, var(--text-muted)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 4px 30px rgba(0,0,0,0.5); 
            width: 100%;
            word-break: break-word;
        }
        
        .hero-subtitle { font-size: 1.4rem; margin-top: 20px; color: var(--accent-orange); letter-spacing: 4px; text-transform: uppercase; font-weight: 700; }

        /* ==========================================================================
           CAPA 3: CAJONES DE CRISTAL PURO ESTILO APPLE (TRANSLÚCIDO + DISTORSIÓN)
           ========================================================================== */
        h2.section-heading { font-family: 'Syne', sans-serif; font-size: 3rem; margin-bottom: 60px; text-transform: uppercase; border-left: 5px solid var(--accent-orange); padding-left: 20px; width: 100%; }
        
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; width: 100%; }
        
        .software-card { 
            /* Fondo completamente cristalino y limpio de color, usa negro sutil para no lavar el fondo */
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.02) 100%);
            
            /* Distorsión del fondo líquido */
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            
            /* Bordes ultra-finos y nítidos (estilo fineline Apple) */
            border: 1px solid rgba
